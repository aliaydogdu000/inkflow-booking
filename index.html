<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InkFlow — Book an Appointment</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1e1e1e;
    --primary: #bb86fc;
    --secondary: #03dac6;
    --error: #cf6679;
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 32px 24px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin: 16px 0 6px;
  }
  input, textarea {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
  }
  textarea { resize: vertical; min-height: 90px; }
  .honeypot { position: absolute; left: -9999px; top: -9999px; }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: var(--primary);
    color: #000;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .message {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  .message.success { display: block; background: rgba(3, 218, 198, 0.15); color: var(--secondary); }
  .message.error { display: block; background: rgba(207, 102, 121, 0.15); color: var(--error); }
  .required { color: var(--error); }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Book an Appointment</h1>
    <p class="subtitle" id="subtitle">Loading studio…</p>

    <form id="bookingForm">
      <label id="labelName" for="name">Full Name <span class="required">*</span></label>
      <input type="text" id="name" required maxlength="200" />

      <label id="labelPhone" for="phone">Phone</label>
      <input type="tel" id="phone" maxlength="30" />

      <label id="labelEmail" for="email">Email</label>
      <input type="email" id="email" maxlength="200" />

      <label id="labelDesc" for="description">Tattoo Description <span class="required">*</span></label>
      <textarea id="description" required maxlength="2000"></textarea>

      <label id="labelDate" for="preferredDate">Preferred Date</label>
      <input type="date" id="preferredDate" />

      <!-- Honeypot: hidden from real users, bots fill every field. -->
      <label class="honeypot" for="website">Website</label>
      <input class="honeypot" type="text" id="website" tabindex="-1" autocomplete="off" />

      <button type="submit" id="submitBtn">Send Request</button>
      <div class="message" id="message"></div>
    </form>
  </div>

<script>
(function () {
  var FUNCTIONS_BASE = 'https://qzchujgzsurrlgjwungd.supabase.co/functions/v1';
  var isTr = (navigator.language || '').toLowerCase().indexOf('tr') === 0;

  var t = isTr ? {
    titleLoading: 'Randevu Talebi',
    subtitleLoading: 'Stüdyo bilgisi yükleniyor…',
    titleFound: function (name) { return name; },
    subtitleFound: 'Randevu talebi gönderin, stüdyo sizinle iletişime geçecek.',
    notFound: 'Stüdyo bulunamadı. Bağlantıyı kontrol edin.',
    labelName: 'Ad Soyad',
    labelPhone: 'Telefon',
    labelEmail: 'E-posta',
    labelDesc: 'Dövme Açıklaması',
    labelDate: 'Tercih Edilen Tarih',
    submit: 'Talep Gönder',
    sending: 'Gönderiliyor…',
    success: 'Talebiniz alındı! Stüdyo en kısa sürede sizinle iletişime geçecek.',
    genericError: 'Bir hata oluştu. Lütfen tekrar deneyin.',
    tooMany: 'Çok fazla talep gönderdiniz. Lütfen daha sonra tekrar deneyin.',
    missingStudio: 'Geçersiz bağlantı — stüdyo belirtilmemiş.'
  } : {
    titleLoading: 'Book an Appointment',
    subtitleLoading: 'Loading studio…',
    titleFound: function (name) { return name; },
    subtitleFound: 'Send a booking request and the studio will get back to you.',
    notFound: 'Studio not found. Please check the link.',
    labelName: 'Full Name',
    labelPhone: 'Phone',
    labelEmail: 'Email',
    labelDesc: 'Tattoo Description',
    labelDate: 'Preferred Date',
    submit: 'Send Request',
    sending: 'Sending…',
    success: 'Your request has been sent! The studio will reach out to you soon.',
    genericError: 'Something went wrong. Please try again.',
    tooMany: 'Too many requests. Please try again later.',
    missingStudio: 'Invalid link — no studio specified.'
  };

  document.getElementById('labelName').innerHTML = t.labelName + ' <span class="required">*</span>';
  document.getElementById('labelPhone').textContent = t.labelPhone;
  document.getElementById('labelEmail').textContent = t.labelEmail;
  document.getElementById('labelDesc').innerHTML = t.labelDesc + ' <span class="required">*</span>';
  document.getElementById('labelDate').textContent = t.labelDate;
  document.getElementById('submitBtn').textContent = t.submit;
  document.getElementById('title').textContent = t.titleLoading;
  document.getElementById('subtitle').textContent = t.subtitleLoading;

  var params = new URLSearchParams(window.location.search);
  var slug = (params.get('studio') || '').trim();
  var form = document.getElementById('bookingForm');
  var messageEl = document.getElementById('message');
  var submitBtn = document.getElementById('submitBtn');

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = 'message ' + type;
  }

  if (!slug) {
    document.getElementById('subtitle').textContent = t.missingStudio;
    submitBtn.disabled = true;
  } else {
    fetch(FUNCTIONS_BASE + '/get-studio-info?slug=' + encodeURIComponent(slug))
      .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
      .then(function (data) {
        document.getElementById('title').textContent = t.titleFound(data.name);
        document.getElementById('subtitle').textContent = t.subtitleFound;
      })
      .catch(function () {
        document.getElementById('subtitle').textContent = t.notFound;
        submitBtn.disabled = true;
      });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = t.sending;
    messageEl.className = 'message';

    var payload = {
      studio_slug: slug,
      customer_name: document.getElementById('name').value.trim(),
      customer_phone: document.getElementById('phone').value.trim(),
      customer_email: document.getElementById('email').value.trim(),
      tattoo_description: document.getElementById('description').value.trim(),
      preferred_date: document.getElementById('preferredDate').value,
      website: document.getElementById('website').value
    };

    fetch(FUNCTIONS_BASE + '/create-booking-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
      })
      .then(function (result) {
        if (result.ok) {
          showMessage(t.success, 'success');
          form.reset();
          submitBtn.style.display = 'none';
        } else if (result.status === 429) {
          showMessage(t.tooMany, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = t.submit;
        } else {
          showMessage(result.data && result.data.error ? result.data.error : t.genericError, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = t.submit;
        }
      })
      .catch(function () {
        showMessage(t.genericError, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = t.submit;
      });
  });
})();
</script>
</body>
</html>
