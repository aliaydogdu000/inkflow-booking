<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InkFlow — Book an Appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F4F4F2;
    --card: #FFFFFF;
    --tile: #F0F0EE;
    --line: #E7E7E4;
    --ink: #111111;
    --on-ink: #FFFFFF;
    --muted: #6B6B68;
    --faint: #A3A39F;
    --success: #2B7349;
    --success-bg: #E8F4EC;
    --danger: #C0362C;
    --danger-bg: #FBEAE8;
    --font: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0B0B;
      --card: #161616;
      --tile: #222222;
      --line: #262626;
      --ink: #F2F2F0;
      --on-ink: #0B0B0B;
      --muted: #9A9A96;
      --faint: #5C5C59;
      --success: #7FCB98;
      --success-bg: #16301F;
      --danger: #F08A80;
      --danger-bg: #3A1A17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow::before { content: "// "; color: var(--faint); }
  .langbar { display: flex; justify-content: flex-end; gap: 4px; }
  .langbar button {
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 8px;
    font-family: inherit;
  }
  .langbar button.active { color: var(--ink); background: var(--card); border-color: var(--line); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  input, textarea {
    width: 100%;
    padding: 13px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  textarea { resize: vertical; min-height: 96px; }
  .honeypot { position: absolute; left: -9999px; top: -9999px; }
  .btn {
    width: 100%;
    padding: 15px;
    background: var(--ink);
    color: var(--on-ink);
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .message {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  .message.success { display: block; background: var(--success-bg); color: var(--success); }
  .message.error { display: block; background: var(--danger-bg); color: var(--danger); }
  a { color: var(--ink); }

  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 480px; padding: 24px 24px 28px; }
  h1 { font-size: 24px; letter-spacing: -0.02em; margin: 16px 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .submit { margin-top: 24px; }
  .required { color: var(--danger); }
  .photo-preview { display: none; margin-top: 8px; }
  .photo-preview img { max-width: 120px; max-height: 120px; border-radius: 8px; display: block; border: 1px solid var(--line); }
  .link-btn { margin-top: 6px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0; font-family: inherit; text-decoration: underline; }
  .powered { text-align: center; margin: 28px auto 40px; font-size: 12px; color: var(--faint); }
  .powered a { color: inherit; text-decoration: none; }
  .powered a:hover { color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="langbar">
      <button type="button" id="langTr">TR</button>
      <button type="button" id="langEn">EN</button>
    </div>
    <h1 id="title">Book an Appointment</h1>
    <p class="subtitle" id="subtitle">Loading studio…</p>

    <form id="bookingForm">
      <label id="labelName" for="name">Full Name <span class="required">*</span></label>
      <input type="text" id="name" required maxlength="200" />

      <label id="labelPhone" for="phone">Phone <span class="required">*</span></label>
      <input type="tel" id="phone" required minlength="5" maxlength="30" />

      <label id="labelEmail" for="email">Email <span class="required">*</span></label>
      <input type="email" id="email" required maxlength="200" />

      <label id="labelDesc" for="description">Tattoo Description <span class="required">*</span></label>
      <textarea id="description" required maxlength="2000"></textarea>

      <label id="labelDate" for="preferredDate">Preferred Date</label>
      <input type="date" id="preferredDate" />

      <label id="labelPhoto" for="photo">Tattoo photo (optional)</label>
      <input type="file" id="photo" accept="image/*" />
      <div id="photoPreviewWrap" class="photo-preview">
        <img id="photoPreview" alt="" />
        <button type="button" id="photoRemove" class="link-btn">Remove</button>
      </div>

      <!-- Honeypot: hidden from real users, bots fill every field. -->
      <label class="honeypot" for="website">Website</label>
      <input class="honeypot" type="text" id="website" tabindex="-1" autocomplete="off" />

      <button type="submit" id="submitBtn" class="btn submit">Send Request</button>
      <div class="message" id="message"></div>
    </form>
  </div>

  <!--
    Büyüme döngüsü: bu sayfayı her stüdyo kendi Instagram biyografisine
    koyuyor, dolayısıyla sayfayı gören her müşteri potansiyel bir kanal.
    Bilinçli olarak ölçülü: stüdyonun kendi markasının önüne geçmemeli.
  -->
  <div class="powered">
    <a href="https://inkflowpro.studio" target="_blank" rel="noopener">
      <span id="poweredText">InkFlow ile hazırlandı</span>
    </a>
  </div>

<script>
(function () {
  var FUNCTIONS_BASE = 'https://qzchujgzsurrlgjwungd.supabase.co/functions/v1';

  var translations = {
    tr: {
      poweredBy: 'InkFlow ile hazırlandı',
      titleLoading: 'Randevu Talebi',
      subtitleLoading: 'Stüdyo bilgisi yükleniyor…',
      titleFound: function (name) { return name; },
      subtitleFound: 'Randevu talebi gönderin, stüdyo sizinle iletişime geçecek.',
      notFound: 'Stüdyo bulunamadı. Bağlantıyı kontrol edin.',
      labelName: 'Ad Soyad',
      labelPhone: 'Telefon',
      labelEmail: 'E-posta',
      labelDesc: 'Dövme Açıklaması',
      labelDate: 'Tercih Edilen Tarih',
      labelPhoto: 'Dövme fotoğrafı (isteğe bağlı)',
      photoRemove: 'Kaldır',
      photoError: 'Bu görsel okunamadı. Lütfen JPEG veya PNG deneyin.',
      submit: 'Talep Gönder',
      sending: 'Gönderiliyor…',
      success: 'Talebiniz alındı! Stüdyo en kısa sürede sizinle iletişime geçecek.',
      genericError: 'Bir hata oluştu. Lütfen tekrar deneyin.',
      tooMany: 'Çok fazla talep gönderdiniz. Lütfen daha sonra tekrar deneyin.',
      missingStudio: 'Geçersiz bağlantı — stüdyo belirtilmemiş.'
    },
    en: {
      poweredBy: 'Powered by InkFlow',
      titleLoading: 'Book an Appointment',
      subtitleLoading: 'Loading studio…',
      titleFound: function (name) { return name; },
      subtitleFound: 'Send a booking request and the studio will get back to you.',
      notFound: 'Studio not found. Please check the link.',
      labelName: 'Full Name',
      labelPhone: 'Phone',
      labelEmail: 'Email',
      labelDesc: 'Tattoo Description',
      labelDate: 'Preferred Date',
      labelPhoto: 'Tattoo photo (optional)',
      photoRemove: 'Remove',
      photoError: 'Could not read this image. Please try a JPEG or PNG.',
      submit: 'Send Request',
      sending: 'Sending…',
      success: 'Your request has been sent! The studio will reach out to you soon.',
      genericError: 'Something went wrong. Please try again.',
      tooMany: 'Too many requests. Please try again later.',
      missingStudio: 'Invalid link — no studio specified.'
    }
  };

  var LANG_KEY = 'inkflow_booking_lang';
  var t = translations.en;
  var currentLang = 'en';
  var lastStudioName = null; // re-render the found title on language switch

  var langTrBtn = document.getElementById('langTr');
  var langEnBtn = document.getElementById('langEn');

  // Required fields always carry the * marker — applied fresh on every
  // language switch so it can never silently drop.
  function setRequiredLabel(id, text) {
    document.getElementById(id).innerHTML = text + ' <span class="required">*</span>';
  }

  function applyLanguage(lang) {
    currentLang = lang;
    t = translations[lang];
    document.documentElement.lang = lang;
    localStorage.setItem(LANG_KEY, lang);

    langTrBtn.classList.toggle('active', lang === 'tr');
    langEnBtn.classList.toggle('active', lang === 'en');

    setRequiredLabel('labelName', t.labelName);
    setRequiredLabel('labelPhone', t.labelPhone);
    setRequiredLabel('labelEmail', t.labelEmail);
    setRequiredLabel('labelDesc', t.labelDesc);
    document.getElementById('labelDate').textContent = t.labelDate;
    document.getElementById('labelPhoto').textContent = t.labelPhoto;
    document.getElementById('photoRemove').textContent = t.photoRemove;
    document.getElementById('poweredText').textContent = t.poweredBy;
    document.getElementById('submitBtn').textContent = t.submit;
    document.getElementById('title').textContent =
      lastStudioName ? t.titleFound(lastStudioName) : t.titleLoading;
    document.getElementById('subtitle').textContent =
      lastStudioName ? t.subtitleFound : t.subtitleLoading;
  }

  langTrBtn.addEventListener('click', function () { applyLanguage('tr'); });
  langEnBtn.addEventListener('click', function () { applyLanguage('en'); });

  var saved = localStorage.getItem(LANG_KEY);
  var initialLang = saved === 'tr' || saved === 'en'
    ? saved
    : ((navigator.language || '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en');
  applyLanguage(initialLang);

  var params = new URLSearchParams(window.location.search);
  var slug = (params.get('studio') || '').trim();

  // Hangi kanaldan gelindiği. Stüdyo linki Instagram biyografisine, WhatsApp'a
  // veya QR koda ayrı ayrı ?src= ile koyuyor; hangisinin gerçekten talep
  // getirdiğini ölçmek için. Sunucu tarafı ayrıca temizliyor ve kısaltıyor,
  // burası yalnızca ilk süzgeç.
  var source = (params.get('src') || '').trim().toLowerCase()
    .replace(/[^a-z0-9_-]/g, '').slice(0, 40);
  var form = document.getElementById('bookingForm');
  var messageEl = document.getElementById('message');
  var submitBtn = document.getElementById('submitBtn');

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = 'message ' + type;
  }

  // Tattoo photo: resized client-side (longest edge 1600px, JPEG 0.8) so the
  // JSON payload stays small (~200-500KB); the Edge Function re-checks size.
  var photoBase64 = null;
  var photoInput = document.getElementById('photo');
  var photoPreviewWrap = document.getElementById('photoPreviewWrap');
  var photoPreview = document.getElementById('photoPreview');

  function clearPhoto() {
    photoBase64 = null;
    photoInput.value = '';
    photoPreviewWrap.style.display = 'none';
    photoPreview.src = '';
  }

  document.getElementById('photoRemove').addEventListener('click', clearPhoto);

  photoInput.addEventListener('change', function () {
    var file = photoInput.files && photoInput.files[0];
    if (!file) { clearPhoto(); return; }

    var img = new Image();
    var objectUrl = URL.createObjectURL(file);
    img.onload = function () {
      var maxEdge = 1600;
      var scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(objectUrl);
      photoBase64 = canvas.toDataURL('image/jpeg', 0.8);
      photoPreview.src = photoBase64;
      photoPreviewWrap.style.display = 'block';
      messageEl.className = 'message';
    };
    img.onerror = function () {
      URL.revokeObjectURL(objectUrl);
      clearPhoto();
      showMessage(t.photoError, 'error');
    };
    img.src = objectUrl;
  });

  if (!slug) {
    document.getElementById('subtitle').textContent = t.missingStudio;
    submitBtn.disabled = true;
  } else {
    fetch(FUNCTIONS_BASE + '/get-studio-info?slug=' + encodeURIComponent(slug))
      .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
      .then(function (data) {
        lastStudioName = data.name;
        document.getElementById('title').textContent = t.titleFound(data.name);
        document.getElementById('subtitle').textContent = t.subtitleFound;
      })
      .catch(function () {
        document.getElementById('subtitle').textContent = t.notFound;
        submitBtn.disabled = true;
      });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = t.sending;
    messageEl.className = 'message';

    var payload = {
      studio_slug: slug,
      customer_name: document.getElementById('name').value.trim(),
      customer_phone: document.getElementById('phone').value.trim(),
      customer_email: document.getElementById('email').value.trim(),
      tattoo_description: document.getElementById('description').value.trim(),
      preferred_date: document.getElementById('preferredDate').value,
      website: document.getElementById('website').value,
      photo_base64: photoBase64,
      source: source || null
    };

    fetch(FUNCTIONS_BASE + '/create-booking-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
      })
      .then(function (result) {
        if (result.ok) {
          showMessage(t.success, 'success');
          form.reset();
          clearPhoto();
          submitBtn.style.display = 'none';
        } else if (result.status === 429) {
          showMessage(t.tooMany, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = t.submit;
        } else {
          showMessage(result.data && result.data.error ? result.data.error : t.genericError, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = t.submit;
        }
      })
      .catch(function () {
        showMessage(t.genericError, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = t.submit;
      });
  });
})();
</script>
</body>
</html>
